[package]
name = "camera_stats"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_plot = "0.29"
kamadak-exif = "0.6"
rawler = "0.8"
image = "0.25"
rfd = "0.13"
walkdir = "2"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
dirs = "5.0"

[dev-dependencies]
tempfile = "3.10"
# Used only by tests to enumerate the serialized field names of
# PhotoTableColumns, so the Settings UI and the struct cannot drift.
serde_json = "1.0"
